name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  real-qc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        multiqc: ['1.25.1', '1.35', 'latest-1x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QC compatibility target
        env:
          MULTIQC_TARGET: ${{ matrix.multiqc }}
        run: |
          if [ "$MULTIQC_TARGET" = "latest-1x" ]; then
            python -m pip install -e '.[test]' 'multiqc>=1.25,<2'
          else
            python -m pip install -e '.[test]' "multiqc==$MULTIQC_TARGET"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          curl -fsSL https://github.com/s-andrews/FastQC/releases/download/v0.13.0/fastqc_v0.13.0.zip -o /tmp/fastqc.zip
          unzip -q /tmp/fastqc.zip -d /tmp
          chmod +x /tmp/FastQC/fastqc
          echo /tmp/FastQC >> "$GITHUB_PATH"
      - run: python scripts/capture-multiqc-fixture.py --output validation/multiqc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiqc-${{ matrix.multiqc }}-evidence
          path: validation/multiqc
      - run: python scripts/create-example-data.py --reads 1000
      - run: python scripts/smoke-real-qc.py
      - name: Provision focused processing tools
        if: matrix.multiqc == '1.35'
        run: bash scripts/setup-processing-ci.sh
      - name: Provision optional QC tools
        run: bash scripts/setup-optional-qc-ci.sh ${{ matrix.multiqc == '1.35' && '--falco-benchmark --nanoplot' || '' }}
      - name: Provision alignment QC tool
        run: bash scripts/setup-alignment-ci.sh ${{ matrix.multiqc == '1.35' && '--mosdepth' || '' }}
      - name: Verify actual RNA-seq CLI and original reports
        if: matrix.multiqc == '1.35'
        run: bash scripts/setup-rna-ci.sh
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: rna-tool-study
          path: validation/rna-tool-study
      - name: Actual SAMtools, CRAM reference safety and MultiQC compatibility
        env:
          QUALIDOCK_REQUIRE_ALIGNMENT_TESTS: '1'
        run: pytest -q backend/tests/test_alignment.py backend/tests/test_alignment_real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alignment-${{ matrix.multiqc }}-evidence
          path: |
            validation/alignment
            validation/alignment-tooling.txt
      - name: Actual RNA-seq reports, annotation security and restart
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_RNA_TESTS: '1'
        run: pytest -q backend/tests/test_rseqc.py backend/tests/test_rseqc_real.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: rna-qc-evidence
          path: validation/rseqc
      - name: Verify Picard CLI and genuine insert reports
        if: matrix.multiqc == '1.35'
        run: bash scripts/setup-picard-ci.sh --study
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: picard-tool-study
          path: validation/picard-tool-study
      - name: Qualify genuine RSeQC gene-body percentile contract on indexed test BAM
        if: matrix.multiqc == '1.35'
        run: |
          python scripts/qualify-rseqc-genebody.py \
            --bam "$RUNNER_TEMP/qualidock-rna-tools/fixture/input.bam" \
            --bed "$RUNNER_TEMP/qualidock-rna-tools/fixture/genes.bed12" \
            --rseqc "$RUNNER_TEMP/qualidock-rna-tools/venv/bin/geneBody_coverage.py" \
            --output validation/rna-gene-body-tool-study
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: rna-gene-body-tool-study
          path: validation/rna-gene-body-tool-study
      - name: Genuine gene-body coverage, index integrity, cancellation and restart
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_GENEBODY_TESTS: '1'
        run: pytest -q backend/tests/test_genebody.py backend/tests/test_genebody_real.py --junitxml=validation/genebody-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: genebody-qc-evidence
          path: |
            validation/genebody
            validation/genebody-tests.xml
      - name: Actual Picard observations, PDF, resources and restart
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_PICARD_TESTS: '1'
        run: pytest -q backend/tests/test_picard.py backend/tests/test_picard_real.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: picard-qc-evidence
          path: validation/picard
      - name: Official RSeQC, Picard and source-mapping MultiQC compatibility
        env:
          QUALIDOCK_REQUIRE_RNA_MULTIQC_TESTS: ${{ matrix.multiqc == '1.35' && '1' || '0' }}
        run: pytest -q backend/tests/test_alignment_multiqc.py --junitxml=validation/rna-multiqc-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rna-multiqc-${{ matrix.multiqc }}-evidence
          path: |
            validation/rna-multiqc
            validation/rna-multiqc-tests.xml
      - name: Actual mosdepth coverage, references and indexed input
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_COVERAGE_TESTS: '1'
        run: pytest -q backend/tests/test_coverage.py backend/tests/test_coverage_real.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: mosdepth-real-evidence
          path: |
            validation/coverage
            validation/mosdepth-tooling.txt
      - name: Actual FastQ Screen and MultiQC compatibility
        env:
          QUALIDOCK_REQUIRE_SCREEN_TESTS: '1'
        run: pytest -q backend/tests/test_screen_real.py
      - name: Conditional Falco engine evaluation
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_FALCO_EVALUATION: '1'
        run: pytest -q backend/tests/test_falco_evaluation.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: falco-engine-evaluation
          path: validation/falco-evaluation
      - name: Actual nanoq QC
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_OPTIONAL_QC_TESTS: '1'
        run: pytest -q backend/tests/test_nanoq_real.py
      - name: Actual NanoPlot QC and plotting overhead
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_NANOPLOT_TESTS: '1'
        run: pytest -q backend/tests/test_nanoplot_real.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: nanoplot-real-evidence
          path: |
            validation/nanoplot
            validation/nanoplot-tooling.txt
      - name: Actual single/paired fastp and SeqKit processing
        if: matrix.multiqc == '1.35'
        env:
          QUALIDOCK_REQUIRE_PROCESSING_TESTS: '1'
          QUALIDOCK_REQUIRE_BENCHMARK_ALIGNMENT_TESTS: '1'
        run: pytest -q backend/tests/test_processing_real.py backend/tests/test_paired_processing.py backend/tests/test_benchmark.py backend/tests/test_benchmark_alignment.py backend/tests/test_inspector.py backend/tests/test_lineage.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.multiqc == '1.35'
        with:
          name: core-processing-io
          path: |
            validation/core-processing-io.json
            validation/benchmarks
      - run: pytest -q backend/tests/test_real_tools.py

  linux-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f scripts/linux-validation.Dockerfile -t qualidock-linux-validation .
      - name: Validate actual tools inside a 1 CPU / 1 GiB cgroup
        run: |
          mkdir -p validation/linux
          docker run --rm --cpus=1 --memory=1g --memory-swap=1g \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/validation/linux:/evidence" qualidock-linux-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-resource-evidence
          path: validation/linux
  report-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]' 'multiqc==1.35' 'playwright>=1.49,<2'
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          curl -fsSL https://github.com/s-andrews/FastQC/releases/download/v0.13.0/fastqc_v0.13.0.zip -o /tmp/fastqc.zip
          unzip -q /tmp/fastqc.zip -d /tmp
          chmod +x /tmp/FastQC/fastqc
          echo /tmp/FastQC >> "$GITHUB_PATH"
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Provision focused processing tools
        run: bash scripts/setup-processing-ci.sh
      - name: Provision optional QC tools
        run: bash scripts/setup-optional-qc-ci.sh --nanoplot
      - name: Provision alignment QC tool
        run: bash scripts/setup-alignment-ci.sh --mosdepth
      - name: Provision RNA QC tools
        run: bash scripts/setup-rna-ci.sh
      - name: Provision Picard and original PDF runtime
        run: bash scripts/setup-picard-ci.sh
      - name: Native insert-size metrics and original PDF downloads
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_picard_browser.py --junitxml=validation/picard-browser.xml
      - name: Native RNA-seq annotations, original values and restart
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_rna_browser.py --junitxml=validation/rna-browser.xml
      - name: Alignment selection, native statistics and restart
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_alignment_browser.py --junitxml=validation/alignment-browser.xml
      - name: Native coverage, target denominators and original reports
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_coverage_browser.py --junitxml=validation/coverage-browser.xml
      - name: NanoPlot original reports and native statistics
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_nanoplot_browser.py --junitxml=validation/nanoplot-browser.xml
      - name: Optional QC native interaction
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_optional_qc_browser.py --junitxml=validation/optional-qc-browser.xml
      - name: Bounded raw and derived FASTQ Inspector
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_inspector_browser.py --junitxml=validation/inspector-browser.xml
      - name: Recorded multi-generation processing lineage
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser/test_lineage_browser.py --junitxml=validation/lineage-browser.xml
      - name: Native processing and before-after comparison
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
          QUALIDOCK_REQUIRE_PROCESSING_TESTS: '1'
        run: pytest -q tests/browser/test_processing_browser.py --junitxml=validation/processing-browser.xml
      - name: Real reports, opaque-origin isolation, proxy paths and restart
        if: matrix.browser == 'chromium'
        env:
          QUALIDOCK_BROWSER: ${{ matrix.browser }}
        run: pytest -q tests/browser --ignore=tests/browser/test_picard_browser.py --ignore=tests/browser/test_rna_browser.py --ignore=tests/browser/test_coverage_browser.py --ignore=tests/browser/test_alignment_browser.py --ignore=tests/browser/test_nanoplot_browser.py --ignore=tests/browser/test_optional_qc_browser.py --ignore=tests/browser/test_processing_browser.py --ignore=tests/browser/test_inspector_browser.py --ignore=tests/browser/test_lineage_browser.py --junitxml=validation/report-browser.xml
      - name: Firefox critical report isolation and interaction
        if: matrix.browser == 'firefox'
        env:
          QUALIDOCK_BROWSER: firefox
        run: pytest -q tests/browser/test_report_viewer.py --junitxml=validation/report-browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-browser-${{ matrix.browser }}
          path: |
            validation/picard-browser.xml
            validation/picard-native*.png
            validation/rna-browser.xml
            validation/rna-*.png
            validation/coverage-browser.xml
            validation/coverage-native*.png
            validation/alignment-browser.xml
            validation/alignment-native*.png
            validation/optional-qc-browser.xml
            validation/nanoplot-browser.xml
            validation/nanoplot-*.png
            validation/nanoq*.png
            validation/screen*.png
            validation/processing-browser.xml
            validation/inspector-browser.xml
            validation/inspector-*.png
            validation/lineage-browser.xml
            validation/lineage-*.png
            validation/report-browser.xml
            validation/native-*.png
            validation/paired-processing-*.png
            validation/history-browser*.json
