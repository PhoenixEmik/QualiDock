name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  real-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' 'multiqc>=1.25,<2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          curl -fsSL https://github.com/s-andrews/FastQC/releases/download/v0.13.0/fastqc_v0.13.0.zip -o /tmp/fastqc.zip
          unzip -q /tmp/fastqc.zip -d /tmp
          chmod +x /tmp/FastQC/fastqc
          echo /tmp/FastQC >> "$GITHUB_PATH"
      - run: python scripts/create-example-data.py --reads 1000
      - run: python scripts/smoke-real-qc.py
      - run: pytest -q backend/tests/test_real_tools.py
